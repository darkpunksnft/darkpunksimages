name: Fix NFT Images Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move Images to Root Images Folder
        run: |
          echo "Moving all images out of part subfolders into the main images folder..."
          
          # Check if part folders exist and move their contents
          for i in {1..7}
          do
            if [ -d "images/part$i" ]; then
              echo "Moving images from images/part$i to images/"
              mv images/part$i/* images/ 2>/dev/null || true
              echo "Removing empty folder images/part$i"
              rm -rf images/part$i
            fi
          done

      - name: Commit and Push Restructured Images
        run: |
          git config --global user.name "darkpunksnft"
          git config --global user.email "darkpunksnft@users.noreply.github.com"
          
          git add images/
          git commit -am "Fix image structure: moved all images directly to root images folder"
          git push origin main
